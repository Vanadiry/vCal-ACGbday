desc:
  main: |-
    加入了地学部的天文班。小时候与苍相遇，并许下了一起去发现新的小行星的约定。自此以后受到苍的影响对天文保持着浓厚兴趣。
    性格天真烂漫，不经深思熟虑便会行动起来。擅长绘画，曾经绘制了一部主角以苍作为原型的BG恋爱漫画。
    喜欢很甜的咖啡。
