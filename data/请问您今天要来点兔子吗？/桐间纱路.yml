name:
  orig: 桐間 紗路
  zh: 桐间纱路
  ja-kana: きりま しゃろ
  ja: 0
desc:
  extra: []
  main: |-
    有一头金色的卷发，外表看起来很有气质，像是完美无缺的大小姐。
    由于父母在外地工作，自己单独住在甘兔庵隔壁的一间破旧的仓库，每天精打细算，过着贫困的生活。在售卖草本茶的餐饮店Fleur du Lapin打工，同时还在其他的店铺做兼职。
    平常不能喝咖啡，因为会像喝酒一样酩酊大醉，但本人不会记得那段记忆。

    纱路的名字源自“乞力马扎罗咖啡”（Kilimanjaro）。
