name:
  orig: 天々座 理世
  zh: 天天座理世
  ja-kana: てでざ りぜ
  ja: 0
desc:
  main: |-
    军人世家的千金大小姐。因为父亲和Rabbit House的店主智乃的父亲是老友，在父亲的介绍下来到Rabbit House打工。
    怕打雷、怕虫子，在这些时候反而需要一直照顾的纱路来摆平。

    理世的名字源自法国熏香加味绿茶“夏日香气”（Thé Des Alizés）。
