name:
  orig: 条河 麻耶
  zh: 条河麻耶
  ja-kana: じょうが まや
  ja: 0
desc:
  main: |-
    娇小活泼的女孩子，特点是飒爽的短发和俏皮的虎牙。有些小恶魔系，喜欢恶作剧，也善于靠卖萌让心爱、理世等人屈服。
    曾被智乃和小惠评价“即便自己烦恼也不把阴郁的氛围带给周边的人”。

    麻耶的名字源自大吉岭红茶（Jogmaya）。
