desc:
  main: |-
    伊御的青梅竹马，与其他四人在不同的班级。
    有一个姐姐美衣子，开有一家蛋糕店「Hatch Potch」，主角团时常会在这里打工。
    第二号麻烦制造者。曾为了买小卖部的特价面包，当着樱川老师的面和伊御毫发无伤地从二层窗户一跃而下。
    和真宵在某些地方非常的合得来。但面对真宵的恶作剧时同样会发火。
