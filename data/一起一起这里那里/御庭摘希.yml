name:
  orig: 御庭 つみき
  zh: 御庭摘希
  ja-kana: みにわ つみき
  ja: 0
desc:
  extra: []
  main: |-
    喜欢伊御的傲娇少女。个子很矮，但头发特别长，正常站立时能到膝盖以下，并且拥有向上卷起的极长的呆毛。
    有猫一样的性格，在心动或者害羞时会长出猫耳，吃醋或者嫉妒是会变成带有怨念的猫眼，甚至咬住对方主要是伊御，个别场景中也出现了猫尾。
    不高兴的时候会发出「つーん」的声音，激动时是「ふかーっ！」，会把「何（なに）よ」说成「あによ」。
