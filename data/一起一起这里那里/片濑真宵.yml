  ja-kana: かたせ まよい
  ja: 0
desc:
  main: |-
    擅长科技的少女。喜欢恶作剧，麻烦制造者之一。情人节的时候在巧克力里放过青蛙肉，被榊称作“恶心巧克力”。
    在学校里一般穿着白大褂，而且会随着季节的变化改变厚薄。但很少将其作为常服。
    经常戏弄摘希（傲娇就是用来调戏的），尽管每次都会遭到反击（暴击），但还是会再次戏弄她，行为像是个M。
