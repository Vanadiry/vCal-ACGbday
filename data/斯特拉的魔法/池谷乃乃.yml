  ja-kana: いけたに のの
  ja: 0
desc:
  main: |-
    不擅长表达真正的自己。原属于演剧部，由于上述原因吵了一架后退部了。同样的原因，很擅长扮演不同的自己，交友方面也成为一道坎。
    实际上也是个很有私心的野心家，一直想方设法依靠SNS部的游戏以及沾歌夜的光让自己成名。在网上直播也是抱着想走红的愿望。
    与其说天然，更像是脑回路清奇少一根筋。
    耳朵很敏感，歌夜常利用这点捉弄她，在她耳边低语、吹气，使她脸色潮红、双眸湿润、娇喘连连。也怕痒。
