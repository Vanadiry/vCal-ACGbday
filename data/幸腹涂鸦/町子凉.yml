  zh: 町子凉
  ja-kana: まちこ リョウ
  ja: 0
desc:
  extra: []
  main: |-
    有活力且擅长做饭。意志坚强、好奇心旺盛，不怎么会向别人撒娇。
    重度选择困难症患者。有时会在两种食物之间徘徊、迟迟拿不定主意。
    吃饭时的喜悦之情会毫无保留的展现出来，因而有着相当诱惑的吃相。此外即便不是在吃饭时间，也会有着随情绪而产生的有趣的过激反应。
