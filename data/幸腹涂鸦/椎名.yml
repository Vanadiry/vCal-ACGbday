desc:
  extra: []
  main: |-
    具有沉静与神秘的一面，面瘫，略腹黑。迷雾重重的自由派。时不时显得有病虚弱，甚至被水洒到就会感冒，以及完全背不起来别人，光是很轻的麒麟就尝试了十次才勉强背起来。
    由于妈妈以前总是在忙活，所以从小是由露子小姐抚养长大的。但妈妈也依然很关心椎名。
    住在古老的大户人家，家中甚至有着野生动物狩猎场。食东西时会表现高雅如大人般的画风。
