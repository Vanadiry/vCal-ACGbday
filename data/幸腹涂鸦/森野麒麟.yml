desc:
  main: |-
    凉的表堂姐妹。在美术预备校结识了椎名，三人感情很好，常常聚在一起。
    与凉同年，个子却很小，不过有着惊人的体能和力气。不擅长家务活，但在料理方面有一定水准。
    有着认生的一面，特别是在不熟悉的大人面前会采取装乖的方式对待。
