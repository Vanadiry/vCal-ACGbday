  zh: 园崎魅音
  ja-kana: そのざき みおん
  ja: 0
desc:
  main: |-
    绿色高马尾的少女。比圭一、礼奈他们高一年级，班上的班长，同时也是社团活动的领导者。
    性格开朗豪放，时常营造各种活跃气氛，偶尔还会像中年大叔一般讲些下流笑话，连自称也会用“大叔”。
    依赖诗音，经常下意识地关心和礼让她。曾经对北条悟史产生过好感，因为诗音恋情的缘故而放弃。
