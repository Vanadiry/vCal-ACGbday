desc:
  extra: []
  main: |-
    与圭一同校的女孩子。本名是竜宮礼奈，自称为“蕾娜”。
    擅长料理，手艺很好。看到“好可爱”的东西会暴走，有不论大小想弄到手“带回家”的习惯。
    十分坚强，从不在团体面前显露脆弱。很讨厌被人骗，在觉察到交流有欺瞒时会直接大喊“嘘だッ”，跟平时腼腆婉约的风格截然相反，因此常常吓到对方。
    宁愿为了所爱主动改变自己。
