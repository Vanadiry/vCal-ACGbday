  main: |-
    圭一的学妹，和沙都子同为小学6年级。
    古手神社的独生女，雏见泽御三家之一，古手家的最后一人。在每年6月的绵流祭担当巫女，被认为是御社神大人的转世，兼具冷静与神秘性，受到村人的喜爱与崇敬。
    在别人遇到倒霉事的时候喜欢去摸头安慰。
