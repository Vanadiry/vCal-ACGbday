desc:
  extra: []
  main: |-
    圭一的学妹，魅音的社团成员之一。善于设置各种陷阱，有“陷阱大师”之称。技巧学习源自越共作战方式的介绍书。
    金黄齐耳发，发间别着黑色的发箍，有虎牙。
    使用奇怪的大小姐语气讲话，不过错误百出，会发出“哦呵呵呵”的笑声。
    好动自傲的顽童外相下藏着一颗脆弱的心，自身也渴望变得更坚强。恶作剧然后反被惩罚整哭是家常便饭，讨厌输却又不会记取教训。小打小闹惹怒同伴后，经常靠着礼奈的可爱控模式来开脱逃罪。
