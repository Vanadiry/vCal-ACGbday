name:
  orig: 羽入
  zh: 羽入
  ja-kana: はにゅう
  ja: 0
desc:
  extra:
  - 啊呜啊呜
  main: |-
    羽入是长期生活在雏见泽、但只有少数人才能看见其真身的神秘少女，是雏见泽唯一的超自然生命体，实际存在超过2600年。
    与古手梨花有着密切的因果关系，也是雏见泽惨剧与时间轮回事件的直接关联者。
    兴趣是终日跟在她感兴趣的人背后。虽然很萌，但此类行为严重神似背后灵，再加上因为不能离开雏见泽，因此又神似地缚灵，所以被世人尊称为“幽灵公主”。
    目睹了大量惨剧，对自己只能袖手旁观怀有相当的愧疚感，所以会在受害者身边一直说“对不起”。雏见泽症候群重症患者“幻听”到的脚步声和有人不断在耳边道歉，其实就是羽入。
