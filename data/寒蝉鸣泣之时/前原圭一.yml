  main: |-
    昭和58年搬入雏见泽并于雏见泽分校就读。
    血气方刚的少年，仗义执言，行动力强。偏差值高达61，智商超群，足以进入顶级学府，转学前也因此被孤立而长期处于高压心理。
    主要武器是从学校北条悟史的柜子中发现的悟史遗留的球棒，与龙宫礼奈的柴刀、园崎诗音的电击棒并列为三大神器。
    经常因惩罚游戏被迫穿女装。
