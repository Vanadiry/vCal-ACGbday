  main: |-
    在Stile担任妹妹角色。虽然长得像小学生，但却是20岁的成年大学生。
    虽然有着宅向的兴趣，但跟夏帆和秋月不同，意外的是个室外派。把子供向动画当作神看待，每星期日早上都会准时收看，亦会收藏cosplay的服装（包括自己的幼稚园校服）。
    加入Stile的原因是最初在街上与店长偶遇时被店长发现，结果将店长误认为是诱拐儿童的怪蜀黍，最后被店长以近乎绑架的方式招募到店中。
