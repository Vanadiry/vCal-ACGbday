name:
  orig: 日向 夏帆
  zh: 日向夏帆
  ja-kana: ひなた かほ
  ja: 0
desc:
  main: |-
    担当角色为傲娇，为了更像傲娇而被迪诺提议改为双马尾。
    对游戏有很大的兴趣，不论是音游、电视游戏还是手机游戏都会玩，就连平板电脑里都是一大堆的游戏应用。
    为了挑战难度经常会到游戏中心玩，亦因此经常缺钱。貌似双亲都很喜欢玩游戏，因此有可能是夏帆游戏成瘾的原因。因为太沉迷于游戏导致现实中的朋友很少，成绩亦很差，经常要补考。
    虽然是傲娇担当，但本性却一点都不傲娇。因为秋月是天然的傲娇，夏帆会把他当作参考对象。和秋月有着共同的游戏兴趣，再加上俩人都是同期的员工，因此相性很合，虽然还未到恋人的程度，但最近俩人的关系似乎有所上升。
