desc:
  extra: []
  main: |-
    发型为粉红色双麻花辫。是个同人画师，笔名为“花园文件夹”。
    起初把自己创作的作品落在了Stile咖啡厅里，去找回之后觉得咖啡厅里的人很适合作为创作素材，就开始在店里一边打工一边收集素材进行创作，平时要用一周时间来赶稿，Comiket前后三天无法上班。
    觉得莓香与店长迪诺的关系很有“萌系”要素，便以这两人为原型绘画出同人志。
