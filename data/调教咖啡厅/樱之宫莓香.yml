desc:
  main: |-
    性格认真且礼貌，但经常因为不擅长待人而尴尬，天生眼神可怕，然后天然地说了一些“抖S”的话容易导致他人误解而烦恼。
    梦想去海外留学，为了筹备资金而不断面试打工，然而因为其眼神凶狠面试失败而失落万分。
    Stile的店长迪诺对包含在此的性格都一见钟情，邀请来他的咖啡厅扮演抖S角色。她自己也没想到她的这种性格在Stile得到了异常发挥...
