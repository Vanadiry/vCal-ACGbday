  main: |-
    性格开朗，热爱生活，笑容灿烂的少女。自称18岁。
    虽然看起来年纪不大，但是心智成熟，完全没有同龄人的幼稚，因此经常被他人认为年龄不小。
    十分注重对年长者的礼节，和亲近的人在一起时会展现不同的一面。
    由于只和弟弟生活，非常希望能快点长大成人。
    画功不是很好，画的青蛙曾被帆高认为是河马。
    没有手机或智能手机。
