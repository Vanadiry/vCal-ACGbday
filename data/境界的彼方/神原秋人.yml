desc:
  main: |-
    没有未来的未来，不是我要的未来！
    被称为半妖的存在、拥有不死之身特性的故事的主人公。
    由于是稀有的存在、既非异界士也非妖梦而感到孤独、本人则对此移开视线活下来。
    最喜欢眼镜、以眼镜士自称。文艺部部所属，高中二年级生。
    喜欢栗山未来。
