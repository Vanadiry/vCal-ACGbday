desc:
  main: |-
    被誉为美人的异界士，用拳头作战，可以徒手击碎威胁性较小的敌人，或者抵御敌方正面攻击；
    另外她可以挥拳敲击地面，制造地表裂缝或土墙牵制敌人行动。
    除了异界士的工作之外，也在长月市立高中担任老师。
    虽然漂亮，但找不到好的男朋友，一听到结婚就会发火。
