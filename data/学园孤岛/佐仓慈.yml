name:
  orig: 佐倉 慈
  zh: 佐仓慈
  ja-kana: さくら めぐみ
  ja: 0
desc:
  main: |-
    巡之丘学院高中现代语文教师，和学生关系亲近，更像朋友而非老师。尽管她经常强调应该叫她“佐仓老师”，但实际上学生们都亲切地称呼她“慈姐”。
    温柔善良，关心学生，许多学生都找她倾诉、谈心。由纪非常喜欢她，她也非常关心由纪。是学园生活部的顾问，存在感稀薄。
    实际上是丈枪由纪遭受打击退行后表现出的救济人格，以佐仓老师的样貌出现在丈枪由纪的幻想中，实际上并不存在。
