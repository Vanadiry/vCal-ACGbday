  zh: 丈枪由纪
  ja-kana: たけや ゆき
  ja: 0
desc:
  main: |-
    巡之丘学园高中3年级学生。是一个天真烂漫的少女，能活跃学园生活部的气氛。
    原本就有着孩子气的元气性格，身高在四人中最矮，但是四人组中年龄最大的。
    为了活跃气氛戴着奇怪（萌萌）的帽子，帽子会始终正对着观众。
    是个吃货，吃起东西狼吞虎咽，甚至来不及尝尝味道。耳朵里长着粉红色的呆毛。
