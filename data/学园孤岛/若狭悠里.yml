  zh: 若狭悠里
  ja-kana: わかさ ゆうり
  ja: 0
desc:
  extra: []
  main: |-
    巡之丘学院高中3年级学生，昵称是里姐，但里姐是除了美纪这个后辈外最小的。
    前园艺部成员，在学校天台种包括小番茄在内的蔬菜，补充学园生活部的菜篮子，对楼顶的其他设施也了如指掌。
    在学园生活部中主持家计，负责料理和打扫，手持一本家计账本，记录着各项物资以及水电供应的精确数据，并经常更新。
    稳重坚强，沉着冷静，现时一些常见危机的对应方法均为悠里所提出。遭遇重大打击后心理也非常脆弱。
