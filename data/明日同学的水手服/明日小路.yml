  main: |-
    因为是乡村孩子，开朗外向。性格天真烂漫，行动大胆。偶尔做事少根筋。
    憧憬着偶像福元干穿着的水手服，发现母亲的母校蜡梅学园的制服也是水手服，因而觉得是命中注定，并以蜡梅学园为目标入学。自己的水手服也是母亲亲手缝的。
