  ja-kana: まきの かんな
  ja: 0
desc:
  extra: []
  main: |-
    咖啡色短发，左侧头发夹着糖果形状发夹。在校总是套着冬校服。几乎面无表情，康娜同款。
    擅长钉钉子。野餐垫上都是钉子图案。小时候因为钉了太多钉子以至于有一段时间完全受不了金属的味道。
    有出色的造房子的技能。为情人节做了一个不小的巧克力房子。和玉子等人建造了鬼屋，在商店街举办鬼屋活动。未来打算大学读建筑学系。
