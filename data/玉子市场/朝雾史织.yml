name:
  orig: 朝霧 史織
  zh: 朝雾史织
  ja-kana: あさぎり しおり
  ja: 0
desc:
  extra: []
  main: |-
    羽毛球部的部员，臂力很好，曾经用羽毛球拍接住飞不动的德拉·打糕难吃，而鸟先生也在这时对史织一见钟情。
    看起来显得比较冷淡，但只不过是有些害羞。内心实际上是十分善良的女孩，在高二时与玉子分到了同一班级，很想与玉子做朋友，最后在咖啡店被北白川玉子攻略。
    头发上的发饰是百奇，并且会更换巧克力味，草莓味，抹茶味等不同的口味。
