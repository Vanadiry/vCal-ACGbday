name:
  orig: 大路 もち蔵
  zh: 大路饼藏
  ja-kana: おおじ もちぞう
  ja: 0
desc:
  main: |-
    玉子的青梅竹马，也是玉子的同学。
    自己的房间和玉子一样都是在店铺的二楼，虽然隔着窗户说话也能听见，但因二人有时会聊到很晚，饼藏的妈妈就给他做了纸杯长绳电话，为了能扔到玉子的房间，里面还加了铁片增重，但扔过去玉子接到的概率只有百分之一，常常能砸中玉子的脑袋。
    每到夏天就得看店和做作业不做就会被妈妈用纸筒敲，基本对自家店的事情没什么兴趣，但在兔子商业街的打糕日那天却跑到玉子家的店里帮忙馅子一眼看出他的目的，倒是家里其他人都没感觉到。
    和玉子一样，收集着兔子山商业街的点数卡片，自己已经收集了50枚。
