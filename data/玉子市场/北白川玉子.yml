  zh: 北白川玉子
  ja-kana: きたしらかわ たまこ
  ja: 0
desc:
  extra: []
  main: |-
    被兔子山商店街全员团宠，掌握了很高的话语权。
    十分喜欢糕饼类小吃，最喜欢的东西也是年糕，虽然性格有些冒失，但制作点心方面可谓天才，擅长将年糕做出完美的团型，并喜欢创造新的造型的年糕，如情人节的爱心年糕。
    成功凑齐了盖满印章的一百本商店街的积分卡，以此兑换商店街的金牌，据称是商店街唯一成功的。
