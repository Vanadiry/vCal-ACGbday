  main: |-
    动画女主北白川玉子的妹妹，小学五年级，名叫馅子却认为太随意，喜欢被叫成馅自己也叫自己馅子。
    不喜欢打糕店的工作。喜欢戏弄无存在感的饼哥。没有遗传到爷爷、父亲、姐姐的“恋爱迟钝”，一眼看出姐姐和饼藏的关系。
