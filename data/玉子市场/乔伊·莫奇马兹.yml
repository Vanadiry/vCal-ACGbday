desc:
  extra: []
  main: |-
    占卜师，深色皮肤，耳朵上有红色耳饰。占卜的方式为鸟占卜，借助小德拉会看见未来的事情。德拉对她言听计从。
    派出寻找王妃的小德拉失联后追到兔子商业街来。因为看见小德拉胖成球，一度以为是商业街居民设下的陷阱，对商业街众人保持警惕。
    乔伊认为玉子就是自己正在寻找的王妃。但是自己也因为陷于对王子的爱慕而伤心。
