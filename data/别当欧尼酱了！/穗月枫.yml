  main: |-
    成熟温柔但有时候会变得麻烦的大姐姐，在家务活上面是美波里的学习对象。
    非常热衷于穿着打扮，身上总是带着各式各样的化妆品，经常将一些美容用品和方法用在绪山真寻的身上。
    妹控，喜欢和穗月椛以及绪山真寻亲密接触，此招被穗月椛习得并熟练地运用于绪山真寻身上。
