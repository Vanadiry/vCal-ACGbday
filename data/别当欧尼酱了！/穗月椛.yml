  main: |-
    有些男孩子气，对绪山真寻似乎有种不一般的好感？
    因为发型的原因很容易被误认为是男孩，但是从兴趣喜好上来看仍然是相当有女性风格的。
    在真寻上中学前经常和真寻两人独自行动，因此建立起了不一般的亲密关系。在真寻上中学后逐渐表现出了一点对真寻的独占倾向，会因为朝日甚至包括美夜和那由多和真寻过于亲近而感到警惕并吃醋。
