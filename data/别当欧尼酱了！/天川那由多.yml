name:
  orig: 天川  なゆた
  zh: 天川那由多
  ja-kana: てんかわ なゆた
  ja: 0
desc:
  main: |-
    不常说话，充满神秘感的初中生。知道真寻的秘密，对真寻自称是“姐姐”派来的帮手。
    平时在学校里总是拿着平板电脑，已知的功能包括拍摄真寻的羞耻视频、收集其他人都看不懂的神秘数据、网购真寻的新内衣等等。
    平时对身边的人会使用敬语，会下意识地称真寻为“欧尼桑”，但是目前除了刚见面后有一次口误之外没有再失误过。
