desc:
  main: |-
    在还是男性的时候，是个善良温柔又疼爱妹妹的哥哥。直到美波里逐渐向天才靠拢后，因为周围的压力导致自己开始把自己锁在家里，沉溺于游戏之中。
    某天被妹妹美波里偷偷下药后变成了女孩子。
    由于长时间不与社会接触，表现得十分怕生。但是，也因为原本是成年人，在变成萝莉后表现得也相比其他人更成熟些。
    原本对于性转药是持抵触态度的。但经过与朋友们的接触之后，因为珍视友谊，变得不再那么热切地希望变回男性，有时候也会想找回自己身为哥哥的尊严。
