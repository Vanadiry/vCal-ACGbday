  zh: 樱花朝日
  ja-kana: おうか あさひ
  ja: 0
desc:
  extra: []
  main: |-
    元气满满的初中生。自来熟，和身边的人很亲近。会主动给朋友取外号并和她们搂搂抱抱，治愈力非常强。
    运动上很有天赋但是学习成绩不好，和真寻一同因为期末考试成绩不得不参加补习。
    睡觉姿势很差，会睡到横七竖八，抢别人被子，但不自觉，以为是枕头妖怪把她弄成这样的。尽管她自己就是枕头妖怪本尊。
