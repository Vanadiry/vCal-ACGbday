desc:
  extra: []
  main: |-
    三年级时，贵树从长野转学到东京。明里转学到4年3班。二人因相似的经历与爱好结识，并逐渐亲密。
    1995年春天，转学到鹿儿岛南种子中学。2004年，大学毕业。
    工作后，与水野理纱交往3年，后因为一些生活上和过去的原因，和水野分手。
