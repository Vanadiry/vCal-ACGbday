name:
  orig: 篠原 明里
  zh: 篠原明里
  ja-kana: しのはら あかり
  ja: 0
desc:
  main: |-
    由于父亲工作的原因，常常转学。后来搬家到东京。
    由于以往经常转学，几乎没有朋友。变得比较孤僻，喜欢在图书馆看书。
    在这里，遇到了远野贵树。由于相似的经历、彼此的深度理解，二人逐渐变得亲密。
    但因父亲工作的关系，父母打算搬回栃木。未能和贵树上同样的初中，两人从此分离。
    从初一开始与贵树保持书信联系，在贵树转学到鹿儿岛之前，二人约定相见告别。
    之后，两人失去了联系。
    多年后，与他人结婚。
