desc:
  main: |-
    汐美学园的学生会长。虽然是个理想主义者，但在校内的支持率非常高。
    她为了实现"这所学园是为了提升学生能力而建的，既然明知这点入学，学生也应该互相切磋琢磨"这一朴素的正论而努力活动着。
    因此她本人自然是努力家，也倾向于要求他人同样努力。
    不过，她也没天真到仅凭正论就一路莽撞行事的程度。
