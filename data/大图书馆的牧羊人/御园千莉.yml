desc:
  main: |-
    乍看是个冷静又淡漠的后辈，但内心其实挺爱恶作剧的。
    对熟络起来的人，她会时不时用手指戳一戳、捏一捏对方的袖子，做出这种含蓄的身体接触。
    嘴上虽总说些有的没的，但活动还是会参加，虽然从表情上看不太出来，她每天都过得很开心。
    歌唱水平在日本属于顶尖级别，在学园里主修声乐。
    她很爱护嗓子，不吃辣等刺激性食物。
