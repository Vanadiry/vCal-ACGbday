desc:
  main: |-
    主人公。求知欲旺盛，哪怕图书部里全是幽灵部员，也能一个人在部室里独自看书。
    自从白崎她们加入图书部后，部室变得热闹起来，他也会感叹看书的时间变少了。
    尽管如此，他还是会尽心尽力地帮白崎推进的活动出把力，是个老好人。
    成绩优秀，但不擅长唱歌和做菜。
    因为成绩出众，过去曾被学生会上门拉拢过几次，但都被他一一拒绝了。
