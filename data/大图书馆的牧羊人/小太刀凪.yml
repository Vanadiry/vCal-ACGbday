  main: |-
    属于汐美学园2年Y组，主修图书馆资讯学科。
    将短发绑于两侧，眼神锐利的活泼美少女。巨乳，在女主角里面胸部是最大的，曾经嘲讽佳奈是贫乳。
    担任图书委员，在图书馆内的图书社办太吵时就会过来警告而常常跟着被卷进去。常常对图书社员做出煽动地发言，尤其针对京太郎特别显著。
