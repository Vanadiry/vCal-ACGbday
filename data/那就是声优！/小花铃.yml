  main: 现役初中生声优，五岁时便作为儿童演员出道，今年迎来了演艺生涯的第十年。学习和工作都能兼顾得很好，有一位名叫纱代的青梅竹马兼同班同学。虽然目前作为声优还只是一个新人而已，不过性格成熟、能力也很高，能够一口气念出来一大串的台词，让一之濑双叶和萌咲莓都显得相当惊讶。
