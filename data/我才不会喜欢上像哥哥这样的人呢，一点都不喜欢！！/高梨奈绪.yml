  main: |-
    高梨家的长女，高中一年B班学生，男主角高梨修辅的妹妹，比修辅小一岁。
    土浦彩叶的同班同学。与楠原寻乃和加藤春华是好友。
    “腹黑、妹妹、控兄”，喜欢哥哥修辅，对哥哥的一切了如指掌，特别是哥哥偷藏的各种工口游戏和书籍，并时常会“帮助”他清理掉其中“非妹系”的部分。
