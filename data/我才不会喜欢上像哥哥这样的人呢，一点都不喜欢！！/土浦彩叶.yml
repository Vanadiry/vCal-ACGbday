desc:
  main: |-
    突然转学到奈绪的班的少女，特征为双马尾与贫乳，胸部甚至比奈绪的还要小。
    是修辅小时候的青梅竹马，为了履行和修辅的“医生游戏”的约定而回来；不过修辅对此印象模糊。
    对修辅主动展开猛烈的追求攻势，甚至在家中架设高性能望远镜对准高梨家，观察著修辅的一举一动。
