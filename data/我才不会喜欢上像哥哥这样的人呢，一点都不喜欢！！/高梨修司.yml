  ja-kana: たかなし しゅうじ
  ja: 0
desc:
  main: |-
    修辅的父亲，奈绪的养父。
    很疼爱奈绪，不愿意她将来出嫁。
    同样十分色情，可以说修辅正是得到了他的遗传。
    对SM系特别感兴趣，还试图将没收而来的修辅的SM书籍秘密据为己有。
    年轻时拉着菜菜香去看色情电影，被菜菜香认为是人生中最尴尬的事情。
