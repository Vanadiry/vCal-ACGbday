desc:
  main: |-
    出生在奥木染町，和悠小时候一起玩耍的女孩，对悠有着特别的感情，总是有着说不出的朝气，遇到什么事都笑嘻嘻的。
    收养她的爷爷去世后，被伊福部八寻收养，在当地的叉依姬神社里担任巫女，乐于助人，经常帮当地人做杂活。
    「能和大家在一起的话，我已经很开心了。只要大家聚在一起，总是能发生各种事。」
