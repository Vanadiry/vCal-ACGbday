name:
  orig: 春日野 悠
  zh: 春日野悠
  ja-kana: かすがの はるか
  ja: 0
desc:
  extra: []
  main: |-
    很受女孩子欢迎，拥有接近便能使第一次见面的女角脸红的特殊技能。
    父母于交通事故身亡后，为了不与妹妹春日野穹被分开收养，从都市搬到儿时曾住过的奥木染，与双胞胎妹妹春日野穹相依为命，下定决心要跟穹在这里努力的生活下去，面对任性且傲娇的妹妹非常包容且照顾，让她有个可以依赖的人。
    「我的，唯一的家人...可爱的妹妹。」
    「还有，确实在我的内心拥有着的对穹的感情...对所爱的人的思念。」
    「哪一个都不想失去。」
    「无论变成什么样子...也绝不能就这样完结。」
