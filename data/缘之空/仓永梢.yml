  zh: 仓永梢
  ja-kana: くらなが こずえ
  ja: 0
desc:
  extra: []
  main: |-
    从小学以来一直就是班长，样子普通，身材也没有特点，给周围人以平庸的感觉，直到从大城市来的春日野悠改变了这一切。
    虽然有如通常班长那样有尽责、干练的外在，但实际上也喜欢看时尚杂志，憧憬都市生活，对悠来自城里这一点很羡慕，因此产生了好感一见钟情，一提到有关悠的事情就会语无伦次。
    「你的那份温柔......有时就是罪恶。」
