  ja: 0
desc:
  extra: []
  main: |-
    石蕗高中一年生。自认为路人角色的少年。
    缺乏危机感，某种意义上的达观。
    由于没有朋友而被妹妹温水佳树担心着。
    入学时填写加入了文艺部。后续成为部长。
    兴趣是轻小说，虽然有妹妹但也会看妹系小说，为避免误会特别藏了起来但还是被佳树发现。喜欢吃鳕宝。
    由于自认平平无奇，在男女关系及恋爱上非常迟钝，总是会被周遭的人吐槽「就是这点不行」。
    不擅长拒绝自己力所能及内别人的正常请求就算表面上拒绝了实际上还是会心软帮忙但是八奈见的请求大多是一些不切实际的玩笑。
