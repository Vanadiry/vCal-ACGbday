name:
  orig: 小鞠 知花
  zh: 小鞠知花
  ja-kana: こまり ちか
  ja: 0
desc:
  extra: []
  main: |-
    温水的同级生，文艺部成员。本作的败犬女主角之一。
    性格极度怕羞，不擅长与人对话，会快速输入智能手机来回复对方。
    喜欢部长玉木慎太郎。在喜欢的人面前也会强忍害羞积极进攻。
    时常用看着水沟般或是看厨余垃圾般的眼神看温水。
    涉及到废部的事是小鞠的地雷。
    对学校饮水台的自来水十分讲究。
    对于自己的外表感到自卑。
