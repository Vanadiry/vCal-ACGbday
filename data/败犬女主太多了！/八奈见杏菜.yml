name:
  orig: 八奈見 杏菜
  zh: 八奈见杏菜
  ja-kana: やなみ あんな
  ja: 0
desc:
  extra: []
  main: |-
    石蕗高中一年生。本作的败犬女主角之一。
    表情丰富，和谁都可以变成好朋友的开朗女子。
    在男生中的人气非常高。不过自己并不知道。
    暗恋着青梅竹马兼邻居的袴田草介，希望草介可以幸福。
    因为某件事与温水和彦认识。
    食量意外的大，没填饱肚子时会很沮丧。只有烧盐柠檬的祖母能够喂饱。
    认为女孩子分为两种，一种是青梅竹马，一种是偷腥猫。
    在一年级结业式那天与温水正式成为朋友。
