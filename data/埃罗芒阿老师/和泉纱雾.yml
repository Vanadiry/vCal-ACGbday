name:
  orig: 和泉 紗霧
  zh: 和泉纱雾
  ja-kana: いずみ さぎり
  ja: 0
desc:
  main: |-
    男主角和泉正宗的妹妹，同时以“埃罗芒阿”为笔名担任和泉正宗创作的小说的插画家。
    由于父母的事故影响，以及兄妹的监护人姑姑打算强行将纱雾带出房间，给纱雾带来了心理阴影，纱雾开始拒绝走出房间，成为了一个确确实实的家里蹲，导致兄妹两人几乎没有交流，直至一年后才第二次见面。
    「那个，才不认识叫那个名字的人...」
