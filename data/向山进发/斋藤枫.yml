  main: |-
    有多年登山经验，独自征服过日本的大部分名山。熟知登山所需知识，也具备相应的身体素质。教给了初学者的葵很多知识，也在她登山受挫时帮助她安慰她。
    沉迷登山导致忽视了很多事，女子力低下。料理做的不好，只会做简单的饭团与速食食品。对外表与时尚不在意，不会化妆且基本只穿运动服装。
