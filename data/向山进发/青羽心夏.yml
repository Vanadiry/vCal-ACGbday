name:
  orig: 青羽 ここな
  zh: 青羽心夏
  ja-kana: あおば ここな
  ja: 0
desc:
  extra: []
  main: |-
    知识丰富，头脑很好，学习成绩优异。性格天然而开朗，同时也坚强且懂得为他人着想。虽然在主人公中年龄最小，但相当可靠，被其他人信赖着。
    运动神经很好，每次登山都能够顺利登顶，包括富士山，而且不显疲态。但是不能熬夜，晚上很早就会困。早上起床则是没什么问题。擅长捞金鱼，在烟花大会上大显身手。
    喜欢童话故事以及可爱的东西，如妖精等，还有吉祥物梦马酱和群马酱。也很亲近动物，喜欢与动物说话，常为寻找野生动物而徒步。同时也被动物亲近。
