name:
  orig: 倉上 ひなた
  zh: 仓上日向
  ja-kana: くらうえ ひなた
  ja: 0
desc:
  extra: []
  main: |-
    葵的青梅竹马，在高中和葵重逢，对葵重提小时候“将来再看一次那时山顶的日出”的约定，积极拉拢引诱葵开始登山。
    和老夫老妻般的葵经常因为日向总是乱动东西而吵架，之后马上会和好如初。
    和大大咧咧的性格不同，成绩反而很好，暑假作业也不像葵一样会拖到最后，而是早早做好然后和家人去旅游。
