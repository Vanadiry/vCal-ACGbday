name:
  orig: 雪村 あおい
  zh: 雪村葵
  ja-kana: ゆきむら あおい
  ja: 0
desc:
  extra: []
  main: |-
    女子高中生，亚麻色头发，发梢渐变成灰蓝色。平常在鬓角处戴着黑色头饰，打工时则会扎起两束小马尾。
    小学时候从登高架上摔了下来有了恐高症，从此没有去坐空中索道，登山之类的运动，也有了比较怕生的一面。
    之后开始喜欢上了做饭、裁缝、看书之类的事。
    再度认识仓上日向后，在登山方面从菜鸟级别到一般掌握登山知识的初级者。
