desc:
  extra:
    - 超高校级的黑道
  main: |-
    旗下有超过三万名道上兄弟的国内最大帮派九头龙组继承人，在他面前娃娃脸是不能说的禁话。
    虽然经常口出狂言，给人感觉很恶劣，但其实是个傲娇，很讲情义。
    有一个才华出众的妹妹，非常受九头龙溺爱，并有“超高校级的妹妹”的称号。 
