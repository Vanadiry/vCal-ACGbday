  extra:
    - 原·超高校级的药剂师
  main: |-
    神色紧张，说话总是将语言一组组地排列，不擅长与他人交流。
    因为戴着口罩，所以很难让人掌握表情，也无法猜测其内心在想什么。
    对自己的才能非常看重，情绪波动时头发会像触手般地飘起来。 
