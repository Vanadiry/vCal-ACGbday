  main: |-
    希望之峰学园的校长。举止稳重、可靠的人物。
    对学园的存在方式怀有疑问，但却无法打消对于拥有才能的美妙之处的好奇心。
    和黄樱公一是旧交，将他作为学园中唯一能和自己开玩笑的人而信赖着。 
