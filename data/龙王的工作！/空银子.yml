desc:
  extra: []
  main: |-
    与八一同为清泷钢介的弟子，虽然年纪比八一小，但因拜入清泷门下的时间比当时六岁的八一早两个星期，而成为八一的师姐。
    个人记录里全是代表胜利的白星，因此被誉为「浪速的白雪姬（浪速の白雪姫）」。
    常被雏鹤爱称呼为“老太婆”。
