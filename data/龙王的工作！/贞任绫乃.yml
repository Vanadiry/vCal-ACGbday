desc:
  main: |-
    具有千金小姐气质的小学三年级生。十分憧憬八一。
    特长是习字和琴。是个铁道粉，对铁路列车的相关知识很了解。
    依然有尿床的习惯。曾经在露营活动中与八一睡在同一个帐篷里并让八一知道了自己的尿床习惯。为了不让闻讯赶来的众人知道她尿床的习惯并使其难堪，八一选择宁愿被众人惩罚也要隐瞒真相。这一举动打动了她，使得她更坚定了自己对八一的爱慕之情。
