  main: |-
    受到让八一收徒的委托，超级自大的大小姐小学女生。
    八一的第二名弟子。名字与爱同为あい。
    幼时常和父母一起下将棋，后来父母因意外双双亡故，伤心地天天趴在床前哭泣。后来为了找回往昔欢乐的时光和更深入地理解父母而不断重复着一个人的棋局。
