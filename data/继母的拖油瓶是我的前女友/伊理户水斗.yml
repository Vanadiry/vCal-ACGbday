  ja-kana: いりど みずと
  ja: 0
desc:
  main: |-
    结女的前男友，喜欢读书的节能主义。
    初中二年级时在图书馆读书时遇到了喜欢阅读推理小说的结女，两人在相处之后开始交往，但在进入初中三年级时两人关系出现恶化并大幅减少交流，最终在初中毕业时和结女分手。
    然而命运弄人的是，在两人分手后一周后因水斗的父亲峰秋和结女的母亲由仁再婚，从前男女友关系转为了义理的姐弟。
