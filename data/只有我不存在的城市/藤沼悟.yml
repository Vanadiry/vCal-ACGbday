desc:
  main: 拥有一种名为“再上映”的时间逆转能力（被动），可以回到某件悲剧发生前的过去。在某一天，母亲佐知子因为目击了一场疑似拐卖儿童事件，对18年前小镇中的事件产生了眉目，并因此被灭口。目击到母亲被害的藤沼悟被指认为第一嫌疑犯，在追捕中发动“再上映”回到1988年，并利用这个机会，努力避免过去和现在的悲剧。
