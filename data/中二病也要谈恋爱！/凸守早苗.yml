  extra:
  - 雷神战锤使／ミョルニルハンマーの使い手「雷锤飓风-Mjolnir Tornado」
  main: |-
    学习成绩学年第一，并且取得高中部的推荐函DEATH。有着横冲直撞的笨蛋性格，所以经常干自作自受的事DEATH。
    以本名“凸守”为第一人称，句尾有“——でぇす（DEATH）”的口癖DEATH。虽然很在意自己的身高，却又极其讨厌牛奶DEATH。
    两年前与小鸟游六花在电磁海洋中产生共鸣DEATH。憧憬着六花的“邪王真眼”，尊称对方为“Master”，自称是“邪王真眼使”六花独一无二的仆从DEATH。
