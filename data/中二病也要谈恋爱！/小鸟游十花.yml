desc:
  extra:
  - 圣调理人／Priestess
  main: |-
    六花的姐姐，住在勇太公寓的楼上，料理水平很高，对猫过敏。
    会随身携带着汤勺，用来和中二状态的六花打架。积极想矫正六花的中二病，但同时也是让六花能发泄失去父亲的悲伤的对象。
    不反对六花和勇太的感情，但并不很支持六花和勇太单独同居。不过原因貌似并不是怕两个人发生某些事情，而是怕两个人一起中二病发作毁天灭地？
