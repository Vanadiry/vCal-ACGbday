desc:
  extra:
  - MoriSummer
  main: |-
    富㭴勇太班上的女班长，把班级管理得井井有条。
    曾经是“亚文化系中二病”患者，现已中二病卒业，因为自己的黑历史而讨厌中二病，并希望以自己的努力让周围的中二病尽早毕业。从初中同学七宫智音那里得知勇太的黑历史，当勇太与六花缔结“契约”后密切地监控着两人。
    讨厌被人称呼作“MoriSummer大人”。
