  main: |-
    通过举办班上“可爱女生选拔赛”收集到了全班女生的情报。败露后，将班上男生全员投票的“可爱女生选拔赛”的责任一人担下，并剃光头谢罪，从此一直以光头或短发形象出现。
    为了五月七日茴香常出入极东魔术昼寝结社之夏，俨然为其编外成员。
    暑假期间为了给茴香学姐买礼物一直在游泳池打工，结果晒黑并收获了自己的爱情，被一个名叫千寻的人告白，但是，是男的。
    在男浴池被千寻发现，在富㭴勇太见证下被千寻二次告白。富㭴勇太走出男浴池后，池门框上的红花落下，浴池里传来经久不息的惨叫。
