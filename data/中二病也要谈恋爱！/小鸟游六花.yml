name:
  orig: 小鳥遊 六花
  zh: 小鸟游六花
  ja-kana: たかなし りっか
  ja: 0
desc:
  extra:
  - 邪王真眼／じゃおうしんがん「爆裂吧，现实现充！粉碎吧，精神！放逐这个世界！」
  main: |-
    身体娇小的重度中二病患者。勇太的恋人。就读于私立银杏学园。
    有着紫色的呆毛，右眼用眼罩遮盖，左手用绷带绑住，有用隐形眼镜制造的异色瞳，贫乳属性。自称自己的右眼是邪王真眼，拥有看到异世界“不可视境界线”的能力。厌恶西红柿。
    在学校创建了“极东魔术昼寝结社の夏”社团，社团教室在一个比较偏远的教室，声称不希望引人注意但是却大张旗鼓的在校内招人。
    名字里的“六花”代表“雪的结晶”的意思，其母亲希望其成长为一个特别的人。
