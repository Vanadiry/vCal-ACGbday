desc:
  extra:
  - 漆黑火焰使／Dark Flame Master
  main: |-
    在学校阳台上独自再重复自己的中二病行为以求摆脱其阴影，却被六花看见，为她所倾慕。
    尽管一开始极力想要避免与六花深交，不过随着时间的推进，两个人在相处中逐渐产生了信赖的感情。
    原本对森夏有好感，但是在见过她腹黑的一面后似乎就没有了这样的感情，然而森夏也专注于和早苗百合，根本不和男生交往。在后期喜欢上六花。
    勇太和六花的座位都在教室最中间一列。
