name:
  orig: 五月七日 くみん
  zh: 五月七日茴香
  ja-kana: つゆり くみん
  ja: 0
desc:
  extra:
  - 战栗的黑暗魔魇使／Night Siesta「Sleepers Wake-眠者归来！」
  main: |-
    兴趣是午睡，走到哪里包里面都装着枕头，拥有无论在哪里都能睡觉的特技。
    有着毛茸茸软绵绵的性格，是罕见的正牌天然。经常遗留物品，惟独不会忘记自己的枕头。
    同小鸟游六花、勇太等人组建同好会“极东魔术昼寝结社之夏”，经常参与六花、凸守等人的中二。
    当学姐处于梦境乱斗时，魔法能力会呈指数增长，在睡觉职业联赛中一跃成为结社中最强的存在。
