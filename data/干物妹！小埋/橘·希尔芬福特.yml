desc:
  extra: []
  main: |-
    小埋的同班同学。成绩优异，视小埋为对手。口头禅是ですわ。
    元气满满，争强好胜，参加各种比赛，非常想赢小埋，以T·S·F的身份参加街霸四的比赛，并且找到小埋的连招漏洞积极获胜，忽然扭头看到人群中的哥哥亚力克斯，于是红着脸逃走了。
    是个重度兄控。在没有认出是本体是小埋的情况下，与U·M·R在游戏厅里玩遍各种游戏，成了朋友，并打算一起去打倒小埋。
    似乎眼里只有小埋。特别喜欢表现自己，穿着与众不同的校服，自带BGM，所到之处闪闪发光。不仅自带背景，还会自带花瓣以便随时制造“撒花”效果。
