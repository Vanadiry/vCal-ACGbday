  main: |-
    小埋的同班同学。捡到小埋的学生证，想要还给小埋，跟踪小埋一个星期找到她家。却误把家里的小埋当成小埋的妹妹小困，并拜小困为师。
    身材娇小，运动神经异常发达，游泳健将。自带冷气，能把附近气氛冰住。认生，只能和小孩子说话，在班里并不受欢迎。传说曾和成年男性动真格打架。
    对土间埋似乎有超越朋友的异样感情。
