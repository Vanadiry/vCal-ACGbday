desc:
  extra: []
  main: |-
    乌菈菈见习生。为了见母亲而来到迷路町的少女。
    来自五殿山。从小在山里因亲生母亲矢见对小雪的委托，在小雪的关照下长大。常做露出度高的打扮，道歉时露出肚皮是常识。
    名字为母亲所取，意为从千万箭矢所指的方向中自由地选择自己前行的道路。
    对应动物为狐狗狸中的狗，千矢有许多类似犬的习性，如元气满满、好动、嗅觉灵敏等。
