  ja: 0
desc:
  extra: []
  main: |-
    雪见财阀的大小姐，觉得自己的名字很土并不喜欢，希望被称作Miss Plum，然而并没有人这么叫。
    同样为成为URARA而来到迷路镇的少女。
    看起来很有常识，也会经常犯迷糊，对恋爱有着憧憬。
    对应动物为黑猫，是西方灵异传说中的代表动物。
