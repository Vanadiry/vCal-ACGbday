desc:
  extra:
  - （巽Xùn绀gàn）
  main: |-
    乌菈菈见习生。名门茶屋巽屋的独生女。
    成绩优秀且个性认真。不喜欢豆皮。头上戴有发带，曾被千矢误认为是耳朵。
    十分憧憬自己的母亲：二番占卜师巽时江。与千矢互相约定成为一番占卜师。
    对应动物为狐狗狸中的狐，巽绀的人物形象温柔美丽，而且经常被狐仙附身，并以此研发出自己的占卜术（狐狸水晶占卜）。
