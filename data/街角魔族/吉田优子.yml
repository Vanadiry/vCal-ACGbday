  main: |-
    魔族后裔，家庭受着“每月生活费仅有4万日元”的诅咒。
    在15岁的一天觉醒了魔族血脉产生了返祖现象，而长出了魔族的角和尾巴。
    以同校的魔法少女桃作为宿敌，想方设法夺取桃的血液以解除诅咒。

    「别……别以为这就算赢了！！」
