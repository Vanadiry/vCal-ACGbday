desc:
  extra: []
  main: |-
    除了相当天然呆之外，各方面都很「平均的」女孩子。虽然不是美女，但是一旦穿上和服，魅力就比平常增加三倍左右。人品很好，朋友很多，但放学后会一起出去玩的朋友就屈指可数了。
    家中经营日式点心店「田村屋」，很会做点心。喜欢收集枕头。
    非常认真又单纯、温柔又诚实，被京介评为「老婆婆的思考模式」。
