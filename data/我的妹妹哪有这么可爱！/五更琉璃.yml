  main: |-
    网名黑猫。SNS社群“宅女集合”的成员之一，桐乃在线下会认识的宅友。有在进行同人社团活动，并开设了个人博客，宅的程度不在桐乃之下。
    经常以哥特萝莉的装扮示人，言行举止都透露着中二病的气息。本性其实非常怕生，因此现实中的朋友很少。
    有两个妹妹日向和珠希。和中二的印象相反，在家的时候是个擅长料理的持家女子，也是很会照顾妹妹的姐姐。
