  main: |-
    外表出众、成绩优秀、运动万能的少女，而且还兼职流行杂志的专属模特。
    阳光的外表下却有着特别的兴趣，是个在意周围眼光的御宅族，喜欢妹系的成人游戏和梅露露的动画。
    原本与哥哥的关系冷淡到极点，在被哥哥偶然发现了兴趣后开始找哥哥进行「人生咨询」。
    虽然平时对哥哥表现得很厌恶，但实际上是个不折不扣的兄控；此外，桐乃也是个「妹控」，十分喜欢玩有妹妹出现的美少女R-18游戏。
