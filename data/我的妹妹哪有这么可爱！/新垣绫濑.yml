  main: |-
    绫濑是桐乃的同班同学和好友，非常喜欢桐乃，同时也是和桐乃一起做模特的同事。
    有乌黑的长发，苗条的身材，表面性格开朗、待人亲切，但实际主观意识很强，对宅文化有极大偏见，是傲娇，游戏中还有病娇属性。擅长家政与做点心，但烹饪实力比起麻奈实和五更琉璃还是略逊一筹。
