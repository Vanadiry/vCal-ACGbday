name:
  orig: 山田 リョウ
  zh: 山田凉
  ja-kana: やまだ リョウ
  ja: 0
desc:
  main: |-
    下北泽高校2年级生。结束乐队的贝斯和作曲担当，同时负责演奏时唱歌曲的和声部分，伊地知虹夏的挚友。
    贝斯技术高超，之前在另一支乐队担任贝斯手，但因为性格不合选择主动退出。
    讨厌乘坐会有生命危险的东西，例如过山车，在驾校练车时因为后轮出界再也不敢实际操作。
    家里是经营医院的所以家境还不错，但她的积蓄全部花在了乐器上，所以没钱的时候会去吃野菜和杂草，甚至会找波奇借钱。
    角色的原型是乐队ASIAN KUNG-FU GENERATION的贝斯担当山田贵洋。
