  main: |-
    比伊地知虹夏大12岁的姐姐，经营着一家叫STARRY的Livehouse。
    性格偏傲娇，说话太过含蓄。不能很好地表达自己的观点，因此她说的话通常需要由在旁的音响师翻译。
    非常欣赏后藤一里，并一直关注和期待她的成长私下录制Live视频时拍的全是波奇，不过社恐的波奇却反而老是误解了星歌的想法，认为自己被星歌盯上了。
    虽已年近三十，但仍需要抱着毛绒玩具睡觉。
