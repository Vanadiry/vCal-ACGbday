desc:
  main: |-
    后藤姐妹的父亲。有一把吉他，并借给了一里。对于一里的音乐活动总是善意地关注着。
    学生时代组过乐队，也有作曲的经验，作品也被地方广告采用过。
    不过，在此之后乐队就不温不火，最后在后藤母亲的“再不去找工作就分手”中退出了乐队。
