desc:
  extra: []
  main: |-
    结束乐队的鼓手兼队长。
    元气温柔的气氛调节者，善解人意，能够细心的观察每个成员并给予关照。梦想是组建人气超高的乐队。
    邀请（生拉硬拽）小波奇加入结束乐队，另外山田凉也是她邀请加入乐队的。
    责任心很强，作为乐队的队长以及唯一的正常人为乐队的各种事情尽心尽力。害怕阴森诡异的事物，对鬼屋很没辙。
    角色的原型是乐队ASIAN KUNG-FU GENERATION的鼓手伊地知洁。
