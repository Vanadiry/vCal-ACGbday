desc:
  extra: []
  main: |-
    乐队SIDEROS的吉他手和歌手，在新宿的一家名为“FOLT”的Livehouse进行演出。
    和SICK HACK的关系非常好，并称呼广井菊里为姐姐，并借给广井不少的钱。
    尽管看上去相当自信，却会因为演出而紧张到三天三夜睡不着觉。
    个性十分傲娇，尽管嘴里看不起结束乐队，但却时刻关注着她们甚至还要到了签名，还教给她们很多有用的东西。
    角色原型为乐队筋肉少女帯的主唱大槻贤二。
