  zh: 喜多郁代
  ja-kana: きた いくよ
  ja: 0
desc:
  main: |-
    结束乐队的吉他和歌手担当。
    个性开朗活泼，精力旺盛，善良细心，是一个有很多朋友和社交活动的现充，喜欢在社交平台上发照片或者直播分享自己的生活。其阳角力高到仿佛能散发光芒，连下北泽大天使伊地知虹夏也感到耀眼。
    长相可爱，学习和运动都不错，在学校里很有人气，也经常会到别的社团当帮手。
    憧憬山田凉，所以撒谎自己会弹吉他而加入结束乐队，但害怕事情败露而逃走；后来在学校遇见小波奇，在波奇的鼓励下莫名其妙地重新加入，开始练习吉他。在波奇的指导下吉他技术渐长。
    角色的原型是乐队ASIAN KUNG-FU GENERATION的吉他及和声担当喜多建介。
