desc:
  main: |-
    春夏秋冬庄的住民。文学少女。和雏子同年级，喜欢吃东西的女孩子。
    在春夏秋冬庄的旧书店工作，喜欢读书。
    由于过于喜欢书本而总是忍不住想要吃书的冲动，有时候会真的放进嘴里。
    性格开朗，面对任何事情都很乐观。喜欢鲨鱼。
