  - 魔法品红／マジアマゼンタ
  main: |-
    魔法少女团体“特蕾丝玛吉雅”中近乎队长一般的存在（事实上三人并没有明确谁是领队），有着一颗纯洁之心的正统魔法少女。
    性格阳光开朗，待人友善，对阴沉的同学柊舞缇娜态度也非常好，即使面对敌人也不会抱有绝对的敌意。不过除此之外相比队友小夜和薰子并没有太过突出的个性，是很典型的魔法少女动画主角配置。
