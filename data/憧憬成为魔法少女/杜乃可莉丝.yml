  - 尼禄爱丽丝／ネロアリス
  main: |-
    小学生。总是沉默寡言，但还能够沟通，兴奋的时候表情会显得十分激动。
    家庭环境较好，有一个疼爱她的母亲，但不知为何也是恶之组织的一员。

    作为尼禄爱丽丝时的形象来源于经典童话《爱丽丝梦游仙境》。
