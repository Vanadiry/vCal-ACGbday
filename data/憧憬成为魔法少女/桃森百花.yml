    魔法少女团体“小诗音们”的成员。17岁的高中生。
    本是普通人，多田兰朵的同学兼朋友，也是兰朵魔法少女身份的知情者。后来在机缘巧合下也成为了魔法少女，加入了小诗音们。
    自称不擅长战斗。直觉和洞察力似乎是小诗音们三人中最强的。
