desc:
  extra:
  - 洛可慕斯卡／ロコムジカ
  main: |-
    曾是艾诺鲁秘达的初期组织「君主团」成员之一，后加入舞缇娜一方。
    梦想是成为一名偶像，但唱功非常糟糕，只有在倾注了深厚感情的时候才能唱得好听。

    其姓氏“阿古屋”来自一种专产珍珠的贝类，怪人名“洛可慕斯卡”取自西班牙语“疯狂的音乐（Música Loca）”。
