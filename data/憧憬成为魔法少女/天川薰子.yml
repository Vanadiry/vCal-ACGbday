  - 魔法硫磺／マジアサルファ
  main: |-
    魔法少女团体“特蕾丝玛吉雅”的成员。
    贫乳，说着一口京都话，表面上和善又彬彬有礼，实则极为毒舌。经常和阿良河基维斗嘴，变身后也常和变身为豹式装甲的基维边对骂边打架。
    害怕章鱼，在遭遇章鱼变成的魔物时会因恐惧导致战斗力大幅下降。
