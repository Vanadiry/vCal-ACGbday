desc:
  extra:
  - 君王艾露诺／ロードエノルメ
  main: |-
    受到维纳里达的号召加入恶之组织艾诺鲁秘达，并成为其中元老「君主团」之领袖的女子。妄图征服世界，拥有强烈的施虐欲望。
    其强大的力量基本上全都是由维纳里达直接赐予，而不是像其他人那样凭自身潜能激发出来的。
    最终被舞缇娜挫败，落了个众叛亲离的下场，更被维纳里达抛弃，下落不明。

    代号“ロードエノルメ”源于西班牙语“Enorme”（极大的；极坏的）。
