desc:
  extra:
  - 莱贝尔布鲁姆／ルベルブルーメ
  main: |-
    曾是艾诺鲁秘达的初期组织「君主团」成员之一，后加入舞缇娜一方。
    性情孤僻，对人态度比较恶劣。是个游戏宅。与青梅竹马的阿古屋真珠经常斗嘴吵架，实际上两人关系非常亲切，战斗时也常常配合。目前与真珠热恋中，虽然两人不愿意承认，但大家都能看出来。

    本名姊母娞摩取自“银莲花”的英语“Anemone”的谐音；怪人名“莱贝尔布鲁姆”取自德语“Leberblume”，意为“叶苔”。
