  - 蓓鲁塞尔嘉／ベルゼルガ
  main: |-
    魔法少女团体“小诗音们”的成员。17岁的高中生。
    桃森百花是她的同学兼好友，也是她魔法少女身份的知情人，后来也成为了魔法少女并与满子一同组成“小诗音们”。
    由于作为魔法少女的能力是操纵血液，因此每次战斗都需要消耗大量血液，需要时刻摄入养分来防止自己贫血。
    讨厌吃像是菠菜这样的蔬菜，但如果是满子为她做的她就不会抗拒。
