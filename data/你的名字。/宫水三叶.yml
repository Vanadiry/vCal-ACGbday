desc:
  main: |-
    住在深山乡间小镇「糸守町」的女高中生。
    身为镇长的父亲离家在外，和还是小学生的妹妹以及祖母三个人生活。
    性格直率，有些粗心，对家族神社的风俗「口嚼酒」和父亲的选举活动等事情感到反感。
    和朋友们对这狭小的城镇叹息，憧憬着东京的华丽生活。
