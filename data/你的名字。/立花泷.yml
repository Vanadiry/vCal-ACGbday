desc:
  main: |-
    居住在东京中心一栋公寓的男高中生。每天和朋友们愉快地度日。
    有着不知哪时获得的绳子，习惯绑于手上做装饰。
    每天和朋友们愉快地度日，课余在一家意式餐厅打工，对同僚奥寺前辈怀有好感。
    对建筑和美术很感兴趣。但在东京生活的他做了个奇怪的梦，在一个从未去过的深山小镇中，与女主宫水三叶交换了身体
