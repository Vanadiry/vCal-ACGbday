desc:
  extra: []
  main: |-
    花名的表姐，由于她祖父（花名的外祖父）担心她受苦受累，因此大学毕业之后一直没有找到工作，现担任花名所住公寓的管理员，每晚九点就睡觉。
    性格温和，包容力极强，并且擅长制作爱心便当，也因此被小玉认为她在和花名谈恋爱。
    与花名的母亲关系很好。
