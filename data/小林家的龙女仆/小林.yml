  main: |-
    戴着眼镜，性格沉稳理性，打扮中性，感情细腻但不善言辞。因为某方面的关系，经常被误当成男孩子。
    女仆狂热厨，就连家里也挂着女仆主题的月历。
    与身为龙族的托尔是恋人，同时也是康娜、伊露露在人间的监护人。
    与泷谷是同事兼挚友。两人经常一起去喝酒并大谈御宅类话题，尤其是女仆话题。
