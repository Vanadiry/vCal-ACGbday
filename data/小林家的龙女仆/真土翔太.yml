name:
  orig: 真ヶ土 翔太
  zh: 真土翔太
  ja-kana: まがつち しょうた
  ja: 0
desc:
  extra: []
  main: |-
    与神奈同样就读于胧冢小学的五年级男孩子。
    成长于魔法使的家族，父亲同时也是小林所在公司的专务。
    已知能够使用火魔法和睡眠魔法，反制如远视魔法之类的（可能是）较低等级的魔法（即便施法者是巨龙），也能骑扫帚飞行。
    平时性格温和内向，但是在玩游戏时会露出鬼畜的一面。爱好是音乐鉴赏。
