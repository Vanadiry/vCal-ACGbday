  zh: 大户爱
  ja-kana: おおと アイ
  ja: 0
desc:
  main: |-
    自幼就因异色瞳在学校遭受欺凌，所以总是用刘海遮住一边的眼睛。
    因救了一只小虫，被引领前往扭蛋，并进入蛋世界中。
    她得知自己在蛋世界中，为不死之身，但是只要击中心脏或是眼睛就会在现实中死亡，与之相对应，在蛋世界中受到的伤害，也会返还到现实世界中。
