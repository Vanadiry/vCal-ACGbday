desc:
  extra: []
  main: |-
    二年F班的忍者，是班长雄二的左膀右臂。擅长入侵、偷拍、暗杀、黑客。
    由于精通忍法且技术宅，所以经常承担特殊作战任务，如掌握他班情况，暗杀他班使者，攻破学校系统等。
    主要武器是照相机，数量极多不可预测且分各种型号。可以根据外型快速比较相机型号。有时召唤兽自带相机。
    暴走状态下身着黑衣，武器是忍者刀，二刀流。
