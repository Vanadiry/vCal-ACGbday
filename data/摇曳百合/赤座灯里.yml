desc:
  main: |-
    七森中学初一学生，入学时和京子、结衣一同加入了娱乐部。性格开朗、温柔慈爱，时常展现和蔼可亲的笑容，自我评价为“虽然有些冒失但很有活力的女孩子”。
    在作品中初次登场时很像是主角，但因为好孩子的性格经常被身边的人（主要是娱乐部成员）当作空气对待（欺负），时常被众人遗忘。
