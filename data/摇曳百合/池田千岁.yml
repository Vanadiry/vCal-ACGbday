  main: |-
    银色齐耳短发，杉浦绫乃的好友和同班同学，性格温柔体贴，有一个双胞胎妹妹。
    对千岁来说，京子和绫乃的组合就是让鼻子大出血的杀必死。进入『绫乃X京子』妄想模式的时候，会摘掉眼镜使视线变得模糊，同时开启心灵之眼而使得精神高度集中。没有眼镜的话妄想就停止不下来，乃至鼻血也不能停止，最终因为贫血而被抬走。妄想全然不顾场合。
