  main: |-
    温柔且善良，总是笑脸迎人眯眯眼都是怪物。成绩十分优异，在中学时期曾经做过学生会会长，是妹妹灯里的崇拜对象
    但是是一个妹控，非常喜欢灯里，卧室里贴满了灯里的照片，然而灯里却并没有察觉到这些。还制作了灯里的抱枕，用来满足自己的欲望。
