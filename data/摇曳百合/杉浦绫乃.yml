name:
  orig: 杉浦 綾乃
  zh: 杉浦绫乃
  ja-kana: すぎうら あやの
  ja: 0
desc:
  extra: []
  main: |-
    清纯内向的学生会副会长，留有紫红色长发并扎成长马尾。在谁眼里都是个开朗、可爱的女孩，但实际上有点怕生。
    总是会在毫无征兆的情况下说出和地名有关的谐音冷笑话，却总能戳中结衣的笑点。
    学年成绩总是第二，每天彻夜学习却总被平时不怎么学习却在学年成绩总是第一的岁纳京子压制。
    在七夕的许愿签上许下了「希望能和她（京子）的关系更好」的愿望。
