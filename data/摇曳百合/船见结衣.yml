name:
  orig: 船見 結衣
  zh: 船见结衣
  ja-kana: ふなみ ゆい
  ja: 0
desc:
  extra: []
  main: |-
    结衣是灯里和京子的朋友，同时也是幼驯染。
    之前在京子偶然捡到已经废部的茶道部的钥匙时，结衣便和京子一起占据了旧茶道部部室，成立了“娱乐部”。
    结衣是娱乐部里最冷静的一个，因此能够调节部内气氛。结衣还非常的温柔、成熟，被千夏等人认为非常地帅气。
