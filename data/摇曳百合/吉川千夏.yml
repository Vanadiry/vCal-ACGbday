  main: |-
    千夏外表看起来十分可爱惹人喜欢，但实际上却是满腹坏水，常常谋划着各种不可告人的事，而事出的原因多数为了取得结衣的爱，但结果往往是失败告终。
    由于外型像小魔女米拉库之故，因此京子很喜欢她，但千夏觉得京子很烦人，不过实际上私下里对京子评价很高。
