desc:
  extra: []
  main: |-
    吉川友子是吉川千夏的姐姐，同时也是一名19岁的大学生。温柔、贤惠的她，曾经是茶道部的成员，茶道经验丰富，因此被千夏所仰慕。
    不同于其他角色，友子十分宠溺千夏。即使是千夏的恐怖画作，抑或是其开挖掘机般的掏耳技术，还是其“打通脉络，疏通筋骨”的按摩技术，也都能发自内心地称赞。
