  main: |-
    大室樱子的妹妹，大室家三姐妹里最小一个，8岁的小学生，茶色长发。
    性格刚强，成绩优秀，运动神经出众，因而在学校被伙伴称呼为“花子大人”。
    喜欢酸奶饮料，对姐姐樱子很刻薄，并直呼樱子的名字，其实是个傲娇姐控。
