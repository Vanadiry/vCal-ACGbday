desc:
  extra: []
  main: |-
    千岁的双胞胎妹妹，和姐姐的区别在于瞳色（绿）。和千岁同样就读于七森中学，不过和千岁不同班。
    相貌和千岁非常相似。性格冷淡，给人一种难以亲近的感觉；但是在和千岁独处时却很爱撒娇。
    和千岁一样拥有百合方面的兴趣，摘下眼镜也会进入妄想模式，在妄想时会流口水并且死不承认。妄想的内容主要是千岁和绫乃的配对。
