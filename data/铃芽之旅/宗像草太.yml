  zh: 宗像草太
  ja-kana: むなかた そうた
  ja: 0
desc:
  extra: []
  main: |-
    「思而复思 祈唤日不见之神 祈唤祖祖代代之土地神 此山此河 承恩甚久 不胜感激 诚惶诚恐 诚惶诚恐 谨遵神旨 予以奉还！」
    留有中长发的神秘青年。
    远离尘世的「闭门师」，为阻止灾害降临踏上寻找门的旅途。
    同为闭门师的祖父宗像羊朗，现于东京的医院中住院。
    草太在前往九州某处遇到了铃芽。
    因某个事件发生后，变成了铃芽的椅子。
