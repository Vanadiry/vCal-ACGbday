desc:
  extra:
  - ♯♯♡姬子
  main: |-
    エロ漫画家，原本想要绘制温馨治愈的动物漫画，因被编辑说画风成熟而开始转型。自称自己相当纯洁，然而自己的妹妹色川美姬才是真正的纯洁娘。
    电脑盲，完全不知道电脑怎么用，在薰子的指导下才有所了解，从而被胜木翼吐槽为“像是老奶奶和孙女”。
    有时会显得比较成熟和一本正经，会像个大姐姐一样照顾后辈和翼，但谈起自己画的漫画时，也会有迷茫和害羞的时候。
    对恋爱很敏感，在察觉到小梦对翼的倾慕之情后，便主动帮助小梦去接近翼。
