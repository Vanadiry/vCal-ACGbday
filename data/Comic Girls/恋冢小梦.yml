  - 恋爱的小梦／恋スル小夢
  main: |-
    薰子的室友。喜欢摸小薰的头。
    喜欢吃甜食，但很在意体重，自身是家里开的甜品店的看板娘。
    性格开朗，很容易和别人成为朋友的类型。
    喜欢胜木翼，甚至连上课也在想着她。成绩很差，根本无法学习，考试后只能补考。
