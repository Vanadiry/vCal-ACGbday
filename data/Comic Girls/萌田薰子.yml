name:
  orig: 萌田 薫子
  zh: 萌田薰子
  ja-kana: もえた かおるこ
  ja: 0
desc:
  extra:
  - 混沌／かおす
  main: |-
    15岁高中生兼萌系四格漫画家，本作的主角。因为漫画水平不足，听从责任编辑编泽麻友的建议，从老家前来入住文芳社女子宿舍，以增长阅历、学习技能。
    尽管是高中生体型却相当娇小，初到宿舍时被舍管、小梦、琉姬、翼等都误认为小学生，甚至有被路人小学生认作同龄人的经历。
    自称身高从小学四年级起就不再长了，只有头发可以证明自己还在成长，所以把头发留得很长，且非常抗拒剪头发。
