  main: |-
    身高不算高但是比薰子高，常常绑着双马尾发型。
    姐控，对翼抱有一定的竞争与嫉妒的心态。与姐姐一样同为电脑盲，而且比姐姐更不会使用电子产品。
    与薰子同为四格漫画家，两人的身高都比较低，性格也有相似的部分，常常在一起行动。
    比众人小两岁，曾误以为薰子和自己同岁甚至比自己小而称呼其为かおすちゃん，不过后来就改口叫“混沌前辈”了。
