  - WING·V
  main: |-
    在集中精神画漫画时，会打扮成漫画中角色。但当行头影响画画时，又会老老实实脱下了。
    怕猫，曾在画漫画时家里寄养的熟人家的猫打翻了墨水瓶导致原稿被毁，从此认为猫是可怕的动物。
    家住自带BGM的城堡，由于母亲不支持她画漫画从而导致母女关系紧张，父亲是公司老板，很喜欢买翼所绘制的漫画。
    有个哥哥。小时候两人常一起看少年漫画。
