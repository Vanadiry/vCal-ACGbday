desc:
  extra:
  - 园田莉香／園田リカ
  main: |-
    是个左撇子，总是戴着眼镜，随身带着记录住宿者活动的管理员记录本，对外秘密地收养着薰子捡到的小猫喵沌。
    就读的高中与薰子她们的相同，在高中时是漫画研究部部员，与当时同为部员的编泽麻友和虹野美晴关系很好。
    性格温和，小梦喜欢称其为りーちゃん，在琉姬的签售会当天帮不会化妆的琉姬化了妆。
    很擅长做料理，负责薰子她们的一日三餐。
