name:
  orig: 種村 小依
  zh: 种村小依
  ja-kana: たねむら こより
  ja: 0
desc:
  main: |-
    白咲花和星野日向的同学，和小之森夏音一起担任班长。
    行动笨拙，毫无料理技能，在同学需要帮助的时候也不能很快给出答案，因此在班里人气比夏音低很多。
    对同学们都去依赖夏音而不依赖自己很有怨言。不过自认为夏音十分依赖自己。小时候因为帮夏音捡飞走的气球而摔伤，让夏音很是担心。
