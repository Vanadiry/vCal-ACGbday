  main: |-
    白咲花的好友，星野宫子的妹妹。称呼宫子为宫姐
    从记事起就最喜欢宫子，什么事情都以姐姐为最优先。每三天就有一天要和宫子睡觉，每次见到宫子都会像无铁炮一样一头扑上去。
    在乃爱不开心时会摸她头或者揉她脸以帮她恢复元气。
