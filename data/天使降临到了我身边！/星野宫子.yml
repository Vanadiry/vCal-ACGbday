desc:
  main: |-
    喜欢Cosplay魔法少女的宅女，由于重度怕羞所以没什么朋友，一直以为人们会注重她的个人形象，怕到以为会得罪别人而不会说谎。对由妹妹星野日向带到家里玩的朋友白咲花一见钟情。
    十分擅长制作料理，尤其是甜品，小花在吃了宫子做的蛋糕后答应了穿上宫子制作的服装并给她拍照的要求，不过禁止从下往上拍。
    非常惧怕母亲星野千鹤。一旦做了什么让母亲生气的事情就会被严厉惩罚。
