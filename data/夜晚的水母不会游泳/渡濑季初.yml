  main: |-
    真昼的青梅竹马。
    作为Vtuber“龙崎诺克丝”活动着，不断发出自己是最强存在的信条。
    是那种很快就能做到的什么都不差的类型，在Vtuber中展示的技术全部都是她本人的。
    但是，这种偏差是她无法适应周围环境的原因之一。
    是唯一能让真昼不介意过去的人，为了她这个重要的朋友，不惜一切帮助。
