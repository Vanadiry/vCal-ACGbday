desc:
  main: |-
    崇尚自由主义的量产型女高中生。
    有感受性太强的倾向，能从心里贴近别人，但也容易因为一点小事而受伤。
    幼年时期以插画家“海月夜”的身份活动，但因某件事而被迫停止活动。
    因此对这种特别的感觉产生了心理阴影，每天都尽可能地保持普通。
    但是，以与花音的相遇为契机，她的日常生活又走向了特别的方向。
