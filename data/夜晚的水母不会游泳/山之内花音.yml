desc:
  main: |-
    对想做的事一门心思的前偶像。
    坚持己见，不被他人的意见所左右的类型。
    曾经作为偶像组合“Sunflower Dolls”的中心成员“橘野乃花”进行活动，但因为某次炎上而毕业。
    为了做真正想做的事，开始摸索那条道路。
    在这个过程中，她遇到了改变自己价值观的水母壁画的作者——海月夜，并发现了自己能做的事情。
