[project]
name = "vcal-acgbday"
version = "0.1.0"
description = "二次元角色生日日历数据生成与检查工具"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
vcal = "scripts.vcal:main"

[dependency-groups]
dev = [
    "icalendar>=7.2.2",
    "ruff>=0.16.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"scripts/check/*.py" = [
  "B008",
]

[tool.setuptools]
packages = ["scripts", "scripts.lib", "scripts.check", "scripts.build", "scripts.import"]
