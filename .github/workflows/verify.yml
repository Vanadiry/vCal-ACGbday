name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Run ruff
        run: uv run --with ruff ruff check .

      - name: Run lint
        run: uv run vcal check lint

      - name: Check dist
        run: uv run vcal check dist

      - name: Build
        run: uv run vcal build --output "${{ runner.temp }}/dist"